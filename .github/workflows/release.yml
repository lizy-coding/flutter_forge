name: Release installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.8"
  NODE_VERSION: "24"

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  build:
    needs: quality
    name: Build ${{ matrix.os }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: android
          - os: ubuntu-latest
            platform: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.quality.outputs.source-sha }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Bootstrap
        shell: bash
        run: |
          flutter pub get --enforce-lockfile
      - name: Verify source and release version
        env:
          EXPECTED_SHA: ${{ needs.quality.outputs.source-sha }}
        run: node tool/release_metadata.js verify
      - name: Build macOS
        if: matrix.platform == 'macos'
        working-directory: apps/flutter_forge
        env:
          FLUTTER_XCODE_CC: ${{ github.workspace }}/apps/flutter_forge/tool/macos/compiler_probe.py
        run: flutter build macos --release
      - name: Package macOS DMG
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          app_path="$GITHUB_WORKSPACE/apps/flutter_forge/build/macos/Build/Products/Release/Flutter Forge.app"
          dmg_root="$RUNNER_TEMP/flutter-forge-dmg"
          app_version="$(sed -n 's/^version: *//p' "$GITHUB_WORKSPACE/apps/flutter_forge/pubspec.yaml" | head -1 | tr -d "'\"" | cut -d+ -f1)"
          dmg_path="$GITHUB_WORKSPACE/release-assets/FlutterForge-${app_version}-macos-arm64.dmg"
          test -d "$app_path"
          binary="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app_path/Contents/Info.plist")"
          lipo -archs "$app_path/Contents/MacOS/$binary" | grep -qw arm64
          test -n "$app_version"
          mkdir -p "$dmg_root"
          mkdir -p "$(dirname "$dmg_path")"
          ditto "$app_path" "$dmg_root/Flutter Forge.app"
          ln -s /Applications "$dmg_root/Applications"
          hdiutil create \
            -volname "Flutter Forge" \
            -srcfolder "$dmg_root" \
            -fs HFS+ \
            -format UDZO \
            -ov \
            "$dmg_path"
          hdiutil verify "$dmg_path"
      - name: Build Windows
        if: matrix.platform == 'windows'
        working-directory: apps/flutter_forge
        run: flutter build windows --release
      - name: Build Android ARM64 debug APK
        if: matrix.platform == 'android'
        working-directory: apps/flutter_forge
        run: flutter build apk --debug --target-platform android-arm64 --split-per-abi
      - name: Stage Android ARM64 debug APK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apps/flutter_forge/release-assets"
          cp "$GITHUB_WORKSPACE/apps/flutter_forge/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk" "$GITHUB_WORKSPACE/apps/flutter_forge/release-assets/flutter_forge-android-arm64-debug.apk"
      - name: Build and verify Web release
        if: matrix.platform == 'web'
        shell: bash
        run: bash tool/build_web_release.sh
      - name: Install Inno Setup
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install innosetup -y
      - name: Build Windows installer
        if: matrix.platform == 'windows'
        working-directory: apps/flutter_forge
        shell: pwsh
        run: |
          $manifest = Get-Content pubspec.yaml -Raw
          $appVersion = [regex]::Match($manifest, '(?m)^version:\s*(\d+\.\d+\.\d+)').Groups[1].Value
          if (-not $appVersion) { throw 'Missing application version' }
          $runnerExe = Get-ChildItem build/windows/x64/runner/Release/*.exe | Select-Object -First 1
          if (-not $runnerExe) { throw 'Missing Windows runner executable' }
          $runnerBytes = [System.IO.File]::ReadAllBytes($runnerExe.FullName)
          $peOffset = [BitConverter]::ToInt32($runnerBytes, 0x3c)
          if ([BitConverter]::ToUInt16($runnerBytes, $peOffset + 4) -ne 0x8664) { throw 'Windows runner is not x64' }
          iscc "/DMyAppVersion=$appVersion" windows/installer/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          $installer = Get-Item "$env:GITHUB_WORKSPACE/flutter_forge-setup-x64.exe"
          if ($installer.VersionInfo.ProductVersion -notlike "$appVersion*") {
            throw "Installer version mismatch: $($installer.VersionInfo.ProductVersion)"
          }
          Write-Output "Installer version verified: $($installer.VersionInfo.ProductVersion)"
      - name: Stage verified platform artifacts
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          EXPECTED_SHA: ${{ needs.quality.outputs.source-sha }}
        run: |
          mkdir -p verified-release
          APP_VERSION="$(node tool/release_metadata.js version)"
          case "$RELEASE_PLATFORM" in
            macos) cp release-assets/*.dmg "verified-release/FlutterForge-${APP_VERSION}-macos-arm64.dmg" ;;
            windows) cp flutter_forge-setup-x64.exe "verified-release/FlutterForge-${APP_VERSION}-windows-x64.exe" ;;
            android) unzip -l apps/flutter_forge/release-assets/*.apk | grep -q "lib/arm64-v8a/"; cp apps/flutter_forge/release-assets/*.apk "verified-release/FlutterForge-${APP_VERSION}-android-arm64-v8a-debug.apk" ;;
            web) (cd apps/flutter_forge/build/web && zip -qr "$GITHUB_WORKSPACE/verified-release/FlutterForge-${APP_VERSION}-web.zip" .) ;;
          esac
          node tool/release_metadata.js stage verified-release
      - uses: actions/upload-artifact@v4
        with:
          name: flutter_forge-${{ matrix.platform }}-${{ github.sha }}
          path: verified-release/*
          if-no-files-found: error
          retention-days: 14
