name: usb_detector_bridge
description: Typed USB device enumeration outcomes and capability queries for Android.
version: 0.1.0
publish_to: 'none'
resolution: workspace
environment:
  sdk: ^3.11.5
  flutter: ">=3.47.2"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.flutterforge.usb_detector_bridge
        pluginClass: UsbDetectorBridgePlugin
