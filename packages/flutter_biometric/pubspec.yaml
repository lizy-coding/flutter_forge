name: flutter_biometric
description: Typed biometric authentication outcomes and capability queries for Android and macOS.
version: 0.2.0
publish_to: none
resolution: workspace
homepage: https://github.com/lizy-coding/flutter_biometric
repository: https://github.com/lizy-coding/flutter_biometric
issue_tracker: https://github.com/lizy-coding/flutter_biometric/issues
topics:
  - biometrics
  - authentication
  - fingerprint
  - face
  - plugin

environment:
  sdk: ^3.11.5
  flutter: ">=3.47.2"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.flutter_biometric
        pluginClass: FlutterBiometricPlugin
      macos:
        pluginClass: FlutterBiometricPlugin
