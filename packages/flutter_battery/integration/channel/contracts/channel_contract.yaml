# ============================================================
# Flutter Battery — Channel Contract
# ============================================================
# This file documents all method/event channels used by the
# flutter_battery plugin and the example app.
#
# Plugin channels (part of the public plugin API):
#   flutter_battery          - method channel for battery operations
#   flutter_battery/battery_stream - event channel for battery events
#
# Optional plugin channels (Android-only):
#   flutter_battery/ble_methods       - BLE method calls
#   flutter_battery/ble_scan_events   - BLE scan event stream
#   flutter_battery/ble_connection_events - BLE connection event stream
#   flutter_battery/peer_methods       - peer sync method calls
#   flutter_battery/peer_events        - peer sync event stream
#
# Example-only channels (NOT part of the plugin public API):
#   iot/native  - IoT demo method channel (Android example only)
#   iot/stream  - IoT demo event channel (Android example only)
# ============================================================

flutter_battery_method_channel:
  name: flutter_battery
  methods:
    - id: getPlatformVersion
    - id: getPlatformCapabilities
      result: map<string,bool>
      scope: implemented_plugin_interfaces_not_permissions_or_hardware
      scopedObservations: independent_stream_ownership_supported
      excluded: [iotExampleBridge, bleCharacteristicNotifications]
    - id: configureBatteryStream
      result: bool
      ownership: merged_dart_observations_independent_of_legacy_callbacks
      atomic_validation: true
      args:
        monitorBatteryLevel: bool
        monitorBatteryInfo: bool
        monitorBatteryHealth: bool
        intervalMs: int_100_to_3600000
        batteryInfoIntervalMs: int_100_to_3600000
        batteryHealthIntervalMs: int_100_to_3600000
        enableDebounce: bool
    - id: readBattery
      scope: phase1_core
      args:
        sample: level_or_info_or_health
      result:
        availability: available_or_noBattery_or_unknown
        level: required_int_0_to_100_when_available
        isCharging: optional_bool_actual_active_charging
        isCharged: optional_bool
        powerSource: external_or_battery_or_unknown
        temperature: optional_finite_number_celsius
        voltage: optional_finite_nonnegative_number_volts
        capacity:
          optional: true
          remaining: optional_nonnegative_int
          fullCharge: optional_positive_int
          design: optional_positive_int
          cycleCount: optional_nonnegative_int
          unit: milliampHours_or_milliwattHours_or_percent_or_unspecified
          source: nonempty_string
        state: optional_health_enum
        timestamp: optional_epoch_milliseconds
    - id: getBatteryLevel
      scope: legacy_only
      result: int?
    - id: getBatteryInfo
      result: map
    - id: getBatteryHealth
      result: map
    - id: getBatteryOptimizationTips
      result: list<string>
    - id: startBatteryLevelListening
    - id: stopBatteryLevelListening
    - id: startBatteryInfoListening
      args:
        intervalMs: int?
    - id: stopBatteryInfoListening
    - id: startBatteryHealthListening
      args:
        intervalMs: int?
    - id: stopBatteryHealthListening
    - id: setPushInterval
      args:
        intervalMs: int
        enableDebounce: bool
    - id: setBatteryLevelThreshold
      args:
        threshold: int
        title: string
        message: string
        intervalMinutes: int
        useFlutterRendering: bool
    - id: stopBatteryMonitoring
    - id: scheduleNotification
      permissions: host_owned_fail_immediately_when_denied
      unsupported: UnsupportedBatteryFeatureException
      args:
        title: string
        message: string
        delayMinutes: int
    - id: showNotification
      permissions: host_owned_fail_immediately_when_denied
      unsupported: UnsupportedBatteryFeatureException
      args:
        title: string
        message: string

flutter_battery_event_channel:
  name: flutter_battery/battery_stream
  dart_lifecycle: shared_native_transport_with_independent_closeable_observations
  invalid_payload: FormatException
  event_types:
    BATTERY_LEVEL:
      required:
        - type
        - timestamp
        - batteryLevel
        - level
      optional:
        - unavailableReason
    BATTERY_INFO:
      required:
        - type
        - timestamp
        - batteryLevel
        - level
        - isCharging
        - state
        - temperature
        - voltage
      optional:
        - isCharged
        - timeToFull
        - timeToEmpty
        - unavailableReason
    BATTERY_HEALTH:
      required:
        - type
        - timestamp
        - batteryLevel
        - level
        - state
        - statusLabel
        - isGood
        - riskLevel
        - recommendations
        - temperature
        - voltage
      optional:
        - isCharging
        - healthPercentage
        - maxCapacity
        - currentCapacity
        - designCapacity
        - cycleCount
        - serialNumber
        - manufacturer
        - deviceName
        - unavailableReason
    BATTERY_UNAVAILABLE:
      required:
        - type
        - timestamp
      optional:
        - unavailableReason
    BATTERY_ERROR:
      required:
        - type
        - timestamp
      optional:
        - error

platform_support_matrix:
  android:
    batteryLevel: true
    batteryInfo: true
    batteryHealth: true
    batteryLevelStream: true
    batteryInfoStream: true
    batteryHealthStream: true
    lowBatteryMonitoring: true
    nativeNotifications: true
    scheduledNotifications: true
    blePeerSync: true
    iotExampleBridge: true
  macos:
    batteryLevel: true
    batteryInfo: true
    batteryHealth: true
    batteryLevelStream: true
    batteryInfoStream: true
    batteryHealthStream: true
    lowBatteryMonitoring: true
    nativeNotifications: false
    scheduledNotifications: false
    blePeerSync: false
    iotExampleBridge: false

# ============================================================
# BLE channels (optional, Android-only plugin feature)
# ============================================================
ble_methods:
  name: flutter_battery/ble_methods
  methods:
    - id: isBleAvailable
    - id: isBleEnabled
    - id: startScan
      args:
        serviceUuid: string?
    - id: stopScan
    - id: connect
      args:
        deviceId: string
        autoConnect: bool
    - id: disconnect
      args:
        deviceId: string?
    - id: writeCharacteristic
      args:
        deviceId: string
        serviceUuid: string
        characteristicUuid: string
        value: list<int>
        withResponse: bool

ble_scan_events:
  name: flutter_battery/ble_scan_events
  payload:
    type: list<map>

ble_connection_events:
  name: flutter_battery/ble_connection_events
  payload:
    state: enum(disconnected|connecting|connected|disconnecting)
    deviceId: string
    error: string?

# ============================================================
# Peer sync channels (optional, Android-only plugin feature)
# ============================================================
peer_methods:
  name: flutter_battery/peer_methods
  methods:
    - id: startMasterMode
    - id: startSlaveMode
    - id: stopMasterMode
    - id: stopSlaveMode
    - id: stopAllPeerModes
    - id: masterConnectToDevice
      args:
        deviceId: string

peer_events:
  name: flutter_battery/peer_events
  payload:
    role: enum(master|slave)
    localBattery: int
    remoteBattery: int?
    connected: bool

# ============================================================
# Example-only channels (NOT part of plugin public API)
# These channels are used by the example app for IoT demo
# purposes and are only available on Android.
# ============================================================
example_iot_native:
  name: iot/native
  status: example_only_android
  implementation_location: example/android/app/src/main/kotlin/com/example/iot/nativekit
  methods:
    - id: scanDevices
      args:
        filters: map
    - id: connect
      args:
        deviceId: string
    - id: startTelemetry
      args:
        deviceId: string
        metrics: list
    - id: stopTelemetry
    - id: requestBatterySnapshot
      args:
        deviceId: string?

example_iot_stream:
  name: iot/stream
  status: example_only_android
  implementation_location: example/android/app/src/main/kotlin/com/example/iot/nativekit
  payload:
    type: enum(telemetry|battery|connection|discovered)
    deviceId: string?
    timestamp: int
    data: map

phase1_public_api:
  version: 0.1.0-dev.1
  core_entrypoint: flutter_battery.dart
  operations: [capabilities, read, observe]
  observation: [events, current, state, close]
  runtime_states: [pending, available, noBattery, unknown, unsupported, permissionDenied, unavailable, invalidData, timedOut, failed, closed]
  invalid_parameters: ArgumentError
  raw_maps_and_global_callbacks: legacy_only

battery_changes:
  name: flutter_battery/battery_changes
  configure_method: configureBatteryChanges
  lifecycle: independent_of_sampling_last_owner_releases_notifications
  native_source:
    macos: IOPSNotificationCreateRunLoopSource
    android: ACTION_BATTERY_CHANGED_BroadcastReceiver
  timers: none
  delivery: initial_then_logical_changes_excluding_timestamp
  level_comparison: level_and_availability
  info_health_comparison: logical_payload_excluding_timestamp
  concurrent_with_sampling: true
