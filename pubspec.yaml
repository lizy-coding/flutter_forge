name: flutter_forge_workspace
description: Flutter Forge workspace container.
publish_to: 'none'

environment:
  sdk: ^3.11.5

# video_player_avfoundation 2.12.x 的 Swift 代码使用了 load(_:isolation:)
# overload，需要 Xcode 26 世代 SDK；CI 的 macos-15-intel runner（Xcode 16.4）
# 编译失败。v1.2.8 / v1.2.9 发布基线是 2.11.0 且在同一 runner 上构建成功，
# 待 CI 工具链升级或上游恢复旧 SDK 兼容后解除本覆盖。
dependency_overrides:
  video_player_avfoundation: 2.11.0

# workspace 必须保持为最后一个顶层节：tool/agent_indexes 的契约测试
# 通过向文件末尾追加成员行来验证未配置成员不能从生成契约中消失。
workspace:
  - packages/forge_articles
  - apps/flutter_forge
  - packages/file_picker_bridge
  - packages/flutter_ioc_core
  - packages/desktop_multi_window
  - packages/flutter_battery
  - packages/usb_network_bridge
  - packages/forge_scene_viewer
