name: main_app
description: A Flutter app shell.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  gcode_core:
    path: ../gcode_core
  flutter_study_learning:
    path: ../flutter_study_learning
  file_picker_bridge:
    path: ../file_picker_bridge
  flutter_ioc_core:
    path: ../flutter_ioc_core
  flutter:
