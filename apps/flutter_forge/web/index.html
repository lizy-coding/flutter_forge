<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Flutter Forge modular learning app.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Flutter Forge">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Flutter Forge</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #f7f9fc;
      color: #16213b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #flutter-forge-loading {
      align-items: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 100%;
      justify-content: center;
    }
    .loading-mark {
      animation: loading-pulse 1.2s ease-in-out infinite;
      background: #2764e7;
      border-radius: 12px;
      height: 42px;
      width: 42px;
    }
    #flutter-forge-loading-status {
      color: #5c6784;
      font-size: 14px;
    }
    #flutter-forge-reload {
      background: #2764e7;
      border: 0;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      display: none;
      padding: 10px 18px;
    }
    @keyframes loading-pulse {
      0%, 100% { opacity: .45; transform: scale(.88); }
      50% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="flutter-forge-loading" role="status" aria-live="polite">
    <div class="loading-mark" aria-hidden="true"></div>
    <strong>Flutter Forge</strong>
    <span id="flutter-forge-loading-status">正在加载应用…</span>
    <button id="flutter-forge-reload" type="button" onclick="location.reload()">
      重新加载
    </button>
  </div>
  <script>
    (() => {
      const startedAt = performance.now();
      const loading = document.getElementById('flutter-forge-loading');
      const status = document.getElementById('flutter-forge-loading-status');
      const reload = document.getElementById('flutter-forge-reload');
      const marks = {};
      const mark = (stage, message) => {
        marks[stage] = Math.round(performance.now() - startedAt);
        performance.mark(`flutter-forge-${stage}`);
        if (message) status.textContent = message;
      };
      const timeout = setTimeout(() => {
        mark('timeout', '加载超时，请检查网络后重试。');
        reload.style.display = 'inline-block';
      }, 10000);
      window.flutterForgeLoading = {
        mark,
        complete() {
          clearTimeout(timeout);
          mark('first-frame');
          loading.remove();
          console.info('[flutter-forge-startup]', marks);
        },
        fail(error) {
          clearTimeout(timeout);
          mark('failed', '加载失败，请重新加载。');
          reload.style.display = 'inline-block';
          console.error('[flutter-forge-startup]', error, marks);
        },
      };
      mark('loading-shell');
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
