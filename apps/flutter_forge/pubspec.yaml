name: flutter_forge_app
description: Flutter Forge app shell.
publish_to: 'none'
version: 1.2.3

environment:
  sdk: ^3.11.5

resolution: workspace

dependencies:
  gcode_core:
    path: ../../packages/gcode_core
  flutter_study_learning:
