name: flutter_forge_app
description: Flutter Forge app shell.
publish_to: 'none'
version: 1.2.6

environment:
  sdk: ^3.11.5
  flutter: '>=3.47.2'

resolution: workspace

dependencies:
  gcode_core:
    git:
      url: https://github.com/lizy-coding/gcode_core.git
      ref: v0.2.0-dev.1
  file_picker_bridge:
    path: ../../packages/file_picker_bridge
  flutter_ioc_core:
    path: ../../packages/flutter_ioc_core
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  provider: ^6.1.5+1
  flutter_riverpod: ^2.5.1
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  dio: ^5.11.0
  collection: ^1.18.0
  flutter_svg: ^2.0.10+1
  two_dimensional_scrollables: ^0.3.0
  device_info_plus: ^10.1.2
  # Local Windows patch: deterministic first-frame redraw and lifecycle safety.
  desktop_multi_window:
    path: ../../packages/desktop_multi_window
  video_player: ^2.10.0
  video_player_web: ^2.4.0
  video_player_win: ^3.2.2
  shared_preferences: ^2.5.5
  webview_flutter: ^4.9.0
  webview_windows: ^0.4.0
  flutter_scene: 0.23.0
  hooks: ^2.0.0
  vector_math: ^2.1.4

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  video_player_platform_interface: ^6.2.1
  flutterguard_cli:
    git:
      url: https://github.com/lizy-coding/flutterguard.git
      ref: 9f9be84a73dc4b99a956a8529b8c334849566b03

flutter:
  config:
    # Keep plugin builds on CocoaPods so the scoped Xcode compiler probe applies.
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - flutter_scene_generated/
